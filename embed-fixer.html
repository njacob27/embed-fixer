<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b1020;--card:#121a2e;--line:#243049;--text:#e8edf8;--mute:#8d9ab5;--blue:#6aa0ff;--green:#4ade80;--purple:#a78bfa;--red:#f87171;--yellow:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.eyebrow{font:600 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
h1{font-size:clamp(30px,6vw,46px);line-height:1.08;margin:6px 0 8px;letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.brand img{width:64px;height:64px;border-radius:15px;border:1px solid var(--line);flex:none}
.brand h1{margin:2px 0 0}
.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
h2{font:600 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
input[type=text],select{width:100%;background:#0d1426;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--blue);border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:#e8edf8;color:#0b1020;border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:16px;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.stat{font:700 34px ui-monospace,Menlo,Consolas,monospace;min-width:34px;text-align:center}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#0d1426;color:var(--text);font-size:22px;cursor:pointer}
.item{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:#0d1426;color:var(--mute);border:0;padding:9px 16px;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on.photo{background:#1c3566;color:#cfe0ff}
.seg button.on.video{background:#3a2a6b;color:#e3d9ff}
.tag{display:inline-block;font:600 12px ui-monospace,Menlo,monospace;padding:3px 9px;border-radius:7px;margin-right:6px}
.tag.cap{background:#14391f;color:var(--green)}.tag.g{background:#3a2a6b;color:#e3d9ff}.tag.p{background:#1c3566;color:#cfe0ff}
.chk{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--text);cursor:pointer}
.chk input{width:20px;height:20px}
pre{background:#0d1426;border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;white-space:pre-wrap;word-break:break-all;font:14px/1.55 ui-monospace,Menlo,Consolas,monospace}
.err{color:var(--red);margin-top:8px;font-size:14px;min-height:20px}
.ok{color:var(--green)}
.prev li{margin:6px 0;color:var(--mute);font-size:14px;word-break:break-all;list-style:none}
.prev{padding:0;margin:0}
label.l{display:block;color:var(--mute);font-size:14px;margin-bottom:6px}
</style>
</head>
<body>
<main>
  <div class="brand"><img id="logo" alt="" width="64" height="64"><div><div class="eyebrow">Discord · FixupX · Embed fixer</div>
  <h1>Tweet Embed Fixer</h1></div></div>
  <p class="sub">Paste a raw X link, set the media, copy a ready-to-send Discord message.</p>

  <div class="card">
    <h2>1 · Paste link</h2>
    <div class="row">
      <input type="text" id="url" placeholder="https://x.com/spacex/status/123?s=20&amp;t=..." autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:220px">
      <button class="btn ghost" id="paste">Paste</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="card">
    <h2>2 · Media in tweet</h2>
    <div class="row" style="margin-bottom:8px">
      <button class="step" id="minus">−</button>
      <div class="stat" id="count">2</div>
      <button class="step" id="plus">+</button>
      <span style="color:var(--mute)">items (max 4)</span>
    </div>
    <div id="items"></div>
    <label class="chk"><input type="checkbox" id="sep"> Embed photos separately (otherwise grouped in the caption embed)</label>
  </div>

  <div class="card">
    <h2>3 · Output</h2>
    <pre id="out">Paste a link to begin.</pre>
    <div class="row"><button class="btn" id="copy">Copy for Discord</button><span id="msg" class="ok"></span></div>
    <h2 style="margin-top:18px">Breakdown</h2>
    <ul class="prev" id="prev"></ul>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let media=['video','video'];
const re=/(?:https?:\/\/)?(?:www\.|mobile\.)?(?:x|twitter|fixupx|fxtwitter|vxtwitter|fixvx)\.com\/([A-Za-z0-9_]+)\/status(?:es)?\/(\d+)/i;
let out='';

function renderItems(){
  $('count').textContent=media.length;
  $('items').innerHTML='';
  media.forEach((t,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML='<span>Media '+(i+1)+'</span><div class="seg"><button class="photo '+(t==='photo'?'on':'')+'">Photo</button><button class="video '+(t==='video'?'on':'')+'">Video</button></div>';
    const [bp,bv]=d.querySelectorAll('button');
    bp.onclick=()=>{media[i]='photo';renderItems();build()};
    bv.onclick=()=>{media[i]='video';renderItems();build()};
    $('items').appendChild(d);
  });
}

function build(){
  const m=re.exec($('url').value.trim());
  const prev=$('prev');prev.innerHTML='';
  if(!m){
    out='';$('out').textContent=$('url').value.trim()?'':'Paste a link to begin.';
    $('err').textContent=$('url').value.trim()?'Couldn’t find a tweet link in that.':'';
    return;
  }
  $('err').textContent='';
  const base=m[1]+'/status/'+m[2], hc='\u2800', sep=' ';
  const embeds=[]; // {url,label,cls}
  const add=(path,label,host)=>{
    const first=embeds.length===0;
    embeds.push({url:'https://'+(first?(host||'fixupx.com'):'g.fixupx.com')+'/'+path,label:(first?'Caption + ':'')+label,cls:first?'cap':'g'});
  };
  const photos=media.map((t,i)=>t==='photo'?i+1:0).filter(Boolean);
  const vids=media.map((t,i)=>t==='video'?i+1:0).filter(Boolean);
  const grouped=!$('sep').checked;
  const vidRest=()=>vids.forEach(i=>add(base+'/video/'+i,'video '+i));
  if(media.length<=1){
    add(base,media.length?media[0]:'tweet');
  }else if(!grouped){
    media.forEach((t,i)=>add(base+'/'+t+'/'+(i+1),t+' '+(i+1)));
  }else if(media[0]==='photo'){
    add(base,photos.length+' photo'+(photos.length>1?'s':'')+' grouped');vidRest();
  }else if(!photos.length){
    vidRest();
  }else if(photos.length===1&&vids.length===1){
    add(base+'/video/1','video 1');add(base+'/photo/'+photos[0],'photo '+photos[0]);
  }else if(photos.length===1){
    add(base+'/photo/'+photos[0],'photo '+photos[0]);vidRest();
  }else{
    add(base,photos.length+' photos grouped','m.fixupx.com');vidRest();
  }
  const links=embeds.map(e=>'['+hc+']('+e.url+')').join(sep);
  out='<https://x.com/'+base+'>'+links;
  $('out').textContent=out;
  prev.innerHTML='<li><span class="tag p">link</span>https://x.com/'+base+' (shown, not embedded)</li>'+
    embeds.map((e,i)=>'<li><span class="tag '+e.cls+'">'+(i+1)+'</span>'+e.label+'<br>'+e.url+'</li>').join('');
}

$('url').addEventListener('input',build);
['sep'].forEach(id=>$(id).addEventListener('change',build));
$('plus').onclick=()=>{if(media.length<4){media.push('video');renderItems();build()}};
$('minus').onclick=()=>{if(media.length>0){media.pop();renderItems();build()}};
$('paste').onclick=async()=>{
  try{$('url').value=await navigator.clipboard.readText();build()}catch(e){$('err').textContent='Clipboard blocked: paste into the box manually.'}
};
$('copy').onclick=async()=>{
  if(!out){return}
  try{await navigator.clipboard.writeText(out)}catch(e){
    const t=document.createElement('textarea');t.value=out;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
  }
  $('msg').textContent='Copied ✓';setTimeout(()=>$('msg').textContent='',1800);
};
try{$('logo').src=document.querySelector('link[rel=icon]').href}catch(e){}
renderItems();build();
</script>
</body>
</html>
